[project]
name = "cmn-c1-015"
version = "1.0.0"
description = "DataAnalysisAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry for wheel-era repos (see the dual-mode
# run-tests CI job), so it is intentionally absent here. Runtime
# deps below MUST use exact == pins (IMP-0002 / gate-dep-pinning).
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pandas==3.0.3",
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
